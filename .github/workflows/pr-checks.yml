# Tests on every pull request: the unit tests (Jest through react-scripts) and the full suite (the
# tests with coverage, then the production build as rolling-release.yml makes it). "Type check"
# reports the TypeScript errors the release build skips (TSC_COMPILE_ON_ERROR, known-errors #4) on
# its own, so the test jobs keep a clean signal; it stays red until they are fixed.
# Versions fixed, each release older than 7 days (checked 2026-10-09): Node 20.18.0, npm as shipped
# with it, dependencies exactly from package-lock.json (npm ci). Actions pinned by commit SHA.

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'
  CI: 'true'  # react-scripts test: run once, no watch mode

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npx react-scripts test --watchAll=false

  full:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests with coverage
        run: npx react-scripts test --watchAll=false --coverage

      - name: Production build
        env:
          TSC_COMPILE_ON_ERROR: 'true'  # as rolling-release.yml; the type errors are the Type check job
        run: npm run build

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: tsc
        run: npx tsc --noEmit

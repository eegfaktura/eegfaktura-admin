# Tests on every pull request: the unit tests (Jest through react-scripts) and the full suite (the
# tests with coverage, then the production build as rolling-release.yml makes it). "Type check"
# reports the TypeScript errors the release build skips (TSC_COMPILE_ON_ERROR) on its own, so the
# test jobs keep a clean signal. The stale CRA sample test src/App.test.tsx runs only in "Known
# errors". Both are report-only for now.
# Versions fixed, each release older than 7 days (checked 2026-10-09): Node 20.18.0, npm as shipped
# with it, dependencies exactly from package-lock.json (npm ci). Actions pinned by commit SHA.
# Every job keeps its output as an artifact for 30 days (test-results-<job>, known-errors-<job>),
# for the CI report collector (vfeeg-development/eegfaktura-dev).
# jest-junit is no dependency, so the test jobs keep their log.

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'
  CI: 'true'  # react-scripts test: run once, no watch mode

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          npx react-scripts test --watchAll=false --testPathIgnorePatterns src/App.test.tsx 2>&1 \
            | tee "$RUNNER_TEMP/results/unit.log"

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30

  full:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests with coverage
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          npx react-scripts test --watchAll=false --coverage --testPathIgnorePatterns src/App.test.tsx 2>&1 \
            | tee "$RUNNER_TEMP/results/full.log"

      - name: Production build
        env:
          TSC_COMPILE_ON_ERROR: 'true'  # as rolling-release.yml; the type errors are the Type check job
        run: npm run build

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-full
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Report-only: known type errors are reported, not blocking.
      - name: tsc
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/results/tsc.log"

      - name: Report-only result
        if: steps.check.outcome == 'failure'
        run: echo "::warning title=Type check::report-only, not blocking - tsc reports type errors (see the tsc step)"

      - name: Keep the check output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: known-errors-typecheck
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30

  known:
    name: Known errors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Report-only: known failing tests are reported, not blocking.
      - name: Stale CRA sample test
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          npx react-scripts test --watchAll=false src/App.test.tsx 2>&1 | tee "$RUNNER_TEMP/results/known.log"

      - name: Report-only result
        if: steps.check.outcome == 'failure'
        run: echo "::warning title=Known errors::report-only, not blocking - a known failing test failed (see the test step)"

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: known-errors-known
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30

# Ziel: NEUE Workflow-Datei in eegfaktura/eegfaktura-admin (existiert dort
# bisher nicht). Frontend-SPA, Caddy-served. Build-Flow:
#   1. npm ci + npm run build -> erzeugt build/
#   2. docker/build-push-action -> GHCR
#      (keycloak-config.json ist als Caddy-Env-Template eingecheckt und wird
#      via `ADD keycloak-config.json /srv` gebacken; Caddy rendert es zur
#      Laufzeit aus KEYCLOAK_URL/_REALM/_CLIENT_ID — kein Runtime-Mount noetig)
#
# Image-Pfad: ghcr.io/eegfaktura/eeg-registration-frontend (Legacy-Name aus
# der Makefile beibehalten, damit kein Image-Rename noetig ist).
#
# ⚠️ STUFE 1: KEIN repository_dispatch-Job. Erstmal nur sicherstellen, dass
# der Source-Code auf einer CI-Maschine durchbaut. Wenn 1-2 push-builds gruen
# sind und das Image im Cluster manuell getestet wurde, wird der
# dispatch-deploy-Job in einer zweiten Iteration ergaenzt (Stufe 3).
#
# Vorbedingung Stufe 1: keine (GITHUB_TOKEN reicht aus, kein PLATFORM_DEPLOY_PAT).
# Vorbedingung Stufe 3: `PLATFORM_DEPLOY_PAT`-Secret im Repo + dispatch-deploy
# job in dieser Datei.

name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
      - 'env/**'
    tags:
      - v*
  # ready_for_review: a draft gets no image build; it runs once the PR is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - main

env:
  REGISTRY: "ghcr.io"
  # Development-Tier (ADR-0005): Push nach vfeeg-development. Legacy-Image-Name
  # eeg-registration-frontend (aus der Makefile) bewusst beibehalten — NICHT
  # ${{ github.repository }} (= eegfaktura/eegfaktura-admin).
  IMAGE_NAME: "vfeeg-development/eeg-registration-frontend"

jobs:
  build-and-push-image:
    # pull requests: not while a draft (pr-checks.yml tests drafts)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.18.0'  # as pr-checks.yml
          cache: 'npm'

      - name: Install dependencies
        # npm ci: Abhaengigkeiten exakt aus package-lock.json, wie in pr-checks.yml.
        run: npm ci --no-audit --no-fund

      - name: Build SPA (npm run build -> ./build)
        # Bricht bei Typfehlern ab (tsc && vite build).
        run: npm run build

      - name: Check the build output
        # Ohne build/index.html wuerde ein Image ohne App gebaut und gepusht.
        run: test -f build/index.html || { echo "::error title=Build::build/index.html missing"; exit 1; }

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title="eegfaktura-admin"
            org.opencontainers.image.description="EEG Faktura admin frontend - Administration tool for EEG manager (meteringpoints + participants)"
            org.opencontainers.image.source=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.url=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.version=${{ github.sha || '' }}
            org.opencontainers.image.revision=${{ github.sha || '' }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            org.opencontainers.image.authors="eegfaktura@vfeeg.org"
            org.opencontainers.image.vendor="Verein zur Förderung von Erneuerbaren Energiegemeinschaften"
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || '' }}
            org.opencontainers.image.ref.name=${{ github.ref || '' }}
            org.opencontainers.image.ref.sha=${{ github.sha || '' }}
            org.opencontainers.image.repository=${{ github.repository || '' }}

      - name: Login to Container Registry
        # Pull-Requests aus Forks haben keine packages:write-Permission — Login-Step
        # wuerde sonst beim PR-Build failen. Nur bei push-Events anmelden + pushen.
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Cross-Org-Push nach vfeeg-development — GITHUB_TOKEN reicht nicht.
          password: ${{ secrets.VFEEG_DEV_PUSH_PAT }}

      - name: Build (PR) / Build and push (push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Triggert das Platform-Repo, damit es den Cluster aktualisiert (Stufe 3).
  # Laeuft nur bei push to default-branch (main/master), nicht bei PRs/Tags.
  # Vorbedingung: PLATFORM_DEPLOY_PAT-Secret im Repo + Mapping
  # `deploy-admin-frontend` in deploy-on-dispatch.yml (vorhanden) + Manifest
  # k8s/33-admin-frontend.yaml zeigt auf vfeeg-development/...:latest (umgestellt).
  dispatch-deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy in platform repo
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_PAT }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "deploy-admin-frontend",
            "client_payload": {
              "image_tag": "latest",
              "source_sha": "${GITHUB_SHA}",
              "source_repo": "${GITHUB_REPOSITORY}",
              "source_ref": "${GITHUB_REF}"
            }
          }
          EOF
          )
          echo "$PAYLOAD" | gh api repos/vfeeg-development/eegfaktura-platform/dispatches --input -
          echo "Dispatched deploy-admin-frontend for sha=${GITHUB_SHA:0:8}"

  # Preview-Deploy (ADR-0007): Push auf preview/** -> pinned Deploy des sha-Builds
  # in die Dev-Zone, ohne main/Release anzufassen. Nur auf preview/**-Branches.
  dispatch-preview-deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/preview/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pinned preview deploy in platform repo
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_PAT }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "deploy-admin-frontend",
            "client_payload": {
              "mode": "pinned",
              "image_tag": "sha-${GITHUB_SHA:0:7}",
              "source_sha": "${GITHUB_SHA}",
              "source_repo": "${GITHUB_REPOSITORY}",
              "source_ref": "${GITHUB_REF}"
            }
          }
          EOF
          )
          echo "$PAYLOAD" | gh api repos/vfeeg-development/eegfaktura-platform/dispatches --input -
          echo "Dispatched pinned preview deploy-admin-frontend for sha-${GITHUB_SHA:0:7}"

  # Feature-Env-Deploy (ADR-0008): Push auf env/<name> -> pinned Deploy des sha-Builds
  # in den Namespace env-<name>. Die Env muss bereits provisioniert sein
  # (overlays/env/<name> im platform-Repo); dieser Job deployt nur hinein.
  dispatch-env-deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/env/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pinned env deploy in platform repo
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_PAT }}
        run: |
          set -eu
          ENV_NAME="${GITHUB_REF#refs/heads/env/}"
          case "$ENV_NAME" in
            *[!a-z0-9-]*|-*|*-|"") echo "Ungueltiger Env-Name aus '$GITHUB_REF' — erlaubt: a-z, 0-9, '-'" >&2; exit 1 ;;
          esac
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "deploy-admin-frontend",
            "client_payload": {
              "mode": "pinned",
              "env": "${ENV_NAME}",
              "image_tag": "sha-${GITHUB_SHA:0:7}",
              "source_sha": "${GITHUB_SHA}",
              "source_repo": "${GITHUB_REPOSITORY}",
              "source_ref": "${GITHUB_REF}"
            }
          }
          EOF
          )
          echo "$PAYLOAD" | gh api repos/vfeeg-development/eegfaktura-platform/dispatches --input -
          echo "Dispatched pinned env deploy-admin-frontend for sha-${GITHUB_SHA:0:7} -> env-${ENV_NAME}"
